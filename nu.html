
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Melissa">
    <title>PicPay</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Cartão Nubank</h1>
    <a href="cartoes.html">Voltar para cartões</a>

    <h2>Fatura</h2>

    <form id="formConfiguracao">
        <label>Data de fechamento:</label>
        <input type="date" id="fechamento" required>

        <label>Data de vencimento:</label>
        <input type="date" id="vencimento" required>

        <label>Juros ao dia (%):</label>
        <input type="number" id="juros" step="0.01" required>

        <button type="submit">Salvar configurações</button>
    </form>

    <h2>Registrar compra</h2>

    <form id="formCompra">
        <label>Descrição:</label>
        <input type="text" id="descricao" required>

        <label>Valor:</label>
        <input type="number" id="valor" step="0.01" required>

        <label>Data da compra:</label>
        <input type="date" id="dataCompra" required>

        <button type="submit">Adicionar compra</button>
    </form>

    <h2>Registrar pagamento</h2>

    <form id="formPagamento">
        <label>Valor pago:</label>
        <input type="number" id="valorPago" step="0.01" required>

        <label>Data do pagamento:</label>
        <input type="date" id="dataPagamento" required>

        <button type="submit">Registrar pagamento</button>
    </form>

    <h2>Resumo</h2>

    <p>Total de compras: R$ <span id="totalCompras">0.00</span></p>
    <p>Total pago: R$ <span id="totalPago">0.00</span></p>
    <p>Total de juros: R$ <span id="totalJuros">0.00</span></p>
    <p>Saldo restante: R$ <span id="saldo">0.00</span></p>

    <h2>Compras registradas</h2>
    <ul id="listaCompras"></ul>

    <h2>Pagamentos registrados</h2>
    <ul id="listaPagamentos"></ul>

    <script src="js/nubank.js"></script>
</body>
</html>
